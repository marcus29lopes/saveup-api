
services:
  postgres:
    image: postgres:17
    container_name: saveup-postgres
    environment:
      POSTGRES_DB: saveup_db
      POSTGRES_USER: saveup
      POSTGRES_PASSWORD: saveup123
    ports:
      - "5433:5432"
    volumes:
      - saveup_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saveup -d saveup_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: saveup-api
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/saveup_db
      DB_USERNAME: saveup
      DB_PASSWORD: saveup123
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  saveup_pgdata:
